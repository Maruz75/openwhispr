<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Images only load from the app itself, data:/blob: URLs and the avatar hosts
      (Gravatar; Google profile photos, while Microsoft photos arrive as data: URLs).
      Anything else, such as an image an injected model reply points at an
      attacker's server, is blocked. A meta tag because the packaged build loads
      from file://, which has no response headers to carry a policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="img-src 'self' data: blob: https://www.gravatar.com https://*.googleusercontent.com"
    />
    <link rel="icon" type="image/png" href="./assets/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/fonts/noto-sans.css">
    <title>OpenWhispr</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
